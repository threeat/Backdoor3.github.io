<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chungju Goguryeo Monument Exhibition</title>

<style>
body{
    font-family: "Georgia", "Times New Roman", serif;
    background: #e9e6e1;
    margin: 0;
    padding: 40px 20px;
    color: #3d342d;
}

.container{
    max-width: 900px;
    margin: auto;
    background: #f8f6f2;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    border: 1px solid #d8d1c7;
}

/* 제목 */
h1{
    text-align: center;
    font-size: 2.2rem;
    line-height: 1.4;
    margin-bottom: 50px;
    color: #2f2721;
    font-weight: bold;
    letter-spacing: 0.5px;
    border-bottom: 2px solid #b8a999;
    padding-bottom: 20px;
}

/* 각 오디오 섹션 */
.section{
    background: #ffffff;
    border-left: 6px solid #8a6d4d;
    border-radius: 10px;
    padding: 25px;
    margin-bottom: 30px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.05);
}

/* 소제목 */
.section h2{
    margin-top: 0;
    margin-bottom: 15px;
    font-size: 1.3rem;
    color: #5a4632;
    font-weight: bold;
}

/* 오디오 플레이어 */
audio{
    width: 100%;
    height: 45px;
    border-radius: 8px;
}

/* 모바일 최적화 */
@media (max-width: 768px){
    body{
        padding: 20px 10px;
    }

    .container{
        padding: 25px 20px;
    }

    h1{
        font-size: 1.6rem;
        margin-bottom: 35px;
    }

    .section{
        padding: 20px;
    }

    .section h2{
        font-size: 1.1rem;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>Chungju Goguryeo Monument Exhibition</h1>

<div class="section">
    <h2>Audio Guide 1</h2>
    <audio controls>
        <source src="audio1.mp3" type="audio/mpeg">
    </audio>
</div>

<div class="section">
    <h2>Audio Guide 2</h2>
    <audio controls>
        <source src="audio2.mp3" type="audio/mpeg">
    </audio>
</div>

<div class="section">
    <h2>Audio Guide 3</h2>

        <source src="audio3.mp3" type="audio/mpeg">

</div>

    </audio>
</div>

<div class="section">
    <h2>Audio Guide 5</h2>
    <audio controls>
        <source src="audio5.mp3" type="audio/mpeg">
    </audio>
</div>

<div class="section">

    <audio controls>
        <source src="audio6.mp3" type="audio/mpeg">
    </audio>
</div>

<div class="section">

<div class="section">

</body>
</html>
